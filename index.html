<script>
/* ======================================================================
   ★ 여기만 바꾸면 돼요 ★
   파이어베이스 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 보이는 firebaseConfig 값을
   아래 { } 안에 그대로 붙여 넣으세요.
   ====================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDwKMMdH29qMSQ_g0wKIXVaIxomvY7JKEA",
  authDomain: "our-class-seat.firebaseapp.com",
  projectId: "our-class-seat",
  storageBucket: "our-class-seat.firebasestorage.app",

  appId: "1:179747763426:web:ec7b3b6a5f6b39377f5abb"
};

<script>
// ==ALGO START==
/* ---------- 공통 로직 (배치 알고리즘) ---------- */
function parseNums(range, exclude){
  const set = new Set();
  String(range || '').split(',').forEach(part => {
    part = part.trim();
    const m = part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if (m) { let a = +m[1], b = +m[2]; if (a > b) [a, b] = [b, a]; for (let i = a; i <= b && i - a < 300; i++) set.add(i); }
    else if (/^\d+$/.test(part)) set.add(+part);
  });
  const ex = new Set();
  String(exclude || '').split(/[,\s]+/).forEach(p => { if (/^\d+$/.test(p)) ex.add(+p); });
  return [...set].filter(n => !ex.has(n)).sort((a, b) => a - b);
}

// 책상 목록 만들기. 2인 책상(짝 자리) 기준, 사용하는 좌석이 있는 책상에만 번호(label)를 붙임
function buildDesks(layout){
  const dis = new Set(layout.disabled || []);
  const desks = []; let n = 0;
  for (let r = 0; r < layout.rows; r++) for (let c = 0; c < layout.pairCols; c++) {
    const all = [0, 1].map(s => r + '-' + c + '-' + s);
    const seats = all.filter(id => !dis.has(id));
    desks.push({ key: r + '-' + c, r, c, all, seats, label: seats.length ? ++n : null });
  }
  return desks;
}

function shuffle(arr, rng){
  rng = rng || Math.random; const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/*
  배치 규칙
  1) 서로가 서로를 짝으로 지목한 경우에만 짝 성립
  2) 짝의 자리 희망: 두 사람의 1·2·3순위를 합산(1순위 3점, 2순위 2점, 3순위 1점)해 짝의 1~3순위를 만듦
  3) 추첨 순서를 무작위로 정한 뒤, 1순위끼리 먼저 배정 → 남은 짝은 2순위 → 3순위
  4) 희망 자리가 모두 찼거나 희망이 없는 짝은 남은 2인 책상에 랜덤
  5) 짝이 성립하지 않은 학생, 미제출 학생은 남은 자리에 랜덤
*/
function assignSeats(layout, students, responses, rng){
  rng = rng || Math.random;
  const desks = buildDesks(layout);
  const byLabel = {}; desks.forEach(d => { if (d.label) byLabel[d.label] = d; });
  const pairDesks = desks.filter(d => d.seats.length === 2);
  const pairLabels = new Set(pairDesks.map(d => d.label));
  const stu = new Set(students);
  const resp = {};
  (responses || []).forEach(x => { if (stu.has(x.num)) resp[x.num] = x; });
  const warnings = [];

  let pairs = [];
  students.forEach(a => {
    const b = resp[a] && resp[a].partner;
    if (b && b !== a && stu.has(b) && resp[b] && resp[b].partner === a && a < b) pairs.push({ members: [a, b] });
  });
  pairs = shuffle(pairs, rng);
  if (pairs.length > pairDesks.length) {
    const cut = pairs.splice(pairDesks.length);
    warnings.push('2인 책상이 ' + pairDesks.length + '개뿐이라 서로 지목한 짝 중 ' + cut.length + '쌍(' + cut.map(p => p.members.join('·')).join(', ') + ')은 짝으로 앉히지 못했어요.');
  }
  const inPair = new Set(); pairs.forEach(p => p.members.forEach(m => inPair.add(m)));

  pairs.forEach(p => {
    const score = {}, best = {}, tie = {};
    p.members.forEach(m => (resp[m].prefs || []).slice(0, 3).forEach((d, i) => {
      if (!pairLabels.has(d)) return;
      score[d] = (score[d] || 0) + (3 - i);
      best[d] = Math.min(best[d] == null ? 9 : best[d], i);
    }));
    Object.keys(score).forEach(d => tie[d] = rng());
    p.prefs = Object.keys(score).sort((x, y) => score[y] - score[x] || best[x] - best[y] || tie[x] - tie[y]).slice(0, 3).map(Number);
  });

  const seatOf = {}; const taken = new Set();
  const put = (desk, nums) => { const o = shuffle(nums, rng); desk.seats.forEach((s, i) => { if (o[i] != null) seatOf[s] = o[i]; }); taken.add(desk.key); };

  for (let k = 0; k < 3; k++) pairs.forEach(p => {
    if (p.desk) return; const d = byLabel[p.prefs[k]];
    if (d && !taken.has(d.key)) { p.desk = d.label; p.got = k + 1; put(d, p.members); }
  });
  const freePair = shuffle(pairDesks.filter(d => !taken.has(d.key)), rng);
  pairs.forEach(p => { if (p.desk) return; const d = freePair.shift(); p.desk = d.label; p.got = 0; put(d, p.members); });

  const singles = shuffle(students.filter(s => !inPair.has(s)), rng);
  const two = shuffle(pairDesks.filter(d => !taken.has(d.key)), rng);
  const one = shuffle(desks.filter(d => d.seats.length === 1 && !taken.has(d.key)), rng);
  let order = two.concat(one);
  if (singles.length % 2 === 1 && one.length) order = [one[0]].concat(two, one.slice(1)); // 홀수면 1인석부터 채워 짝 없이 혼자 앉는 2인 책상을 줄임
  const free = []; order.forEach(d => shuffle(d.seats, rng).forEach(s => free.push(s)));
  const unplaced = [];
  singles.forEach((s, i) => { if (free[i]) seatOf[free[i]] = s; else unplaced.push(s); });
  if (unplaced.length) warnings.push('좌석이 부족해 ' + unplaced.join(', ') + '번은 배치하지 못했어요. 좌석 설정을 확인해 주세요.');

  const oneSided = [];
  students.forEach(a => { const b = resp[a] && resp[a].partner; if (b && !inPair.has(a)) oneSided.push({ from: a, to: b }); });
  const unsubmitted = students.filter(s => !resp[s]);

  return {
    layout: { rows: layout.rows, pairCols: layout.pairCols, disabled: (layout.disabled || []).slice() },
    seatOf, pairs: pairs.map(p => ({ members: p.members, got: p.got, desk: p.desk })),
    oneSided, unsubmitted, warnings, unplaced
  };
}
// ==ALGO END==

/* ---------- 환경 (파이어베이스 / 체험 모드) ---------- */
const FB = !!(typeof firebase !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.projectId && !/여기/.test(FIREBASE_CONFIG.apiKey));
const REAL = FB;
const APP_URL = FB ? location.origin + location.pathname : location.href.split('#')[0];
let MODE = FB ? (new URLSearchParams(location.search).has('admin') ? 'admin' : 'student') : 'student';
let fdb = null, fauth = null;
if (FB) { firebase.initializeApp(FIREBASE_CONFIG); fdb = firebase.firestore(); fauth = firebase.auth(); }

function defaultConfig(){
  return { title: '우리 반 자리배치', rows: 4, pairCols: 4, disabled: [], studentRange: '1-35', studentExclude: '4, 11, 34',
    students: parseNums('1-35', '4, 11, 34'), names: {}, open: true };
}
function sanitizeConfig(c){
  const d = defaultConfig(); c = c || {};
  const rows = Math.max(1, Math.min(10, parseInt(c.rows) || d.rows));
  const pairCols = Math.max(1, Math.min(8, parseInt(c.pairCols) || d.pairCols));
  const valid = new Set(); for (let r = 0; r < rows; r++) for (let k = 0; k < pairCols; k++) for (let s = 0; s < 2; s++) valid.add(r + '-' + k + '-' + s);
  const names = {}; Object.keys(c.names || {}).forEach(k => { const v = String(c.names[k]).trim().slice(0, 20); if (/^\d+$/.test(k) && v) names[k] = v; });
  return { title: String(c.title || d.title).slice(0, 60), rows, pairCols,
    disabled: (c.disabled || []).filter(x => valid.has(x)),
    studentRange: String(c.studentRange == null ? d.studentRange : c.studentRange).slice(0, 200),
    studentExclude: String(c.studentExclude == null ? d.studentExclude : c.studentExclude).slice(0, 200),
    students: parseNums(c.studentRange == null ? d.studentRange : c.studentRange, c.studentExclude == null ? d.studentExclude : c.studentExclude),
    names, open: c.open !== false };
}
function sanitizeSubmission(cfg, data){
  if (!cfg.open) throw new Error('지금은 제출 기간이 아니에요.');
  const num = Number(data.num);
  if (cfg.students.indexOf(num) < 0) throw new Error('번호가 올바르지 않아요.');
  let partner = (data.partner == null || data.partner === '') ? null : Number(data.partner);
  if (partner !== null && (partner === num || cfg.students.indexOf(partner) < 0)) partner = null;
  const valid = buildDesks(cfg).filter(d => d.seats.length === 2).map(d => d.label);
  const prefs = [];
  if (partner !== null) (data.prefs || []).forEach(p => { p = Number(p); if (valid.indexOf(p) >= 0 && prefs.indexOf(p) < 0 && prefs.length < 3) prefs.push(p); });
  return { num, partner, prefs };
}

const Store = {
  mem: {},
  get(k){ try { const v = localStorage.getItem('seatdemo_' + k); if (v != null) return JSON.parse(v); } catch (e) {} return this.mem[k] == null ? null : this.mem[k]; },
  set(k, v){ this.mem[k] = v; try { localStorage.setItem('seatdemo_' + k, JSON.stringify(v)); } catch (e) {} }
};
const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };
const Mock = {
  cfg(){ return sanitizeConfig(Store.get('config') || defaultConfig()); },
  resp(){ return Store.get('responses') || []; },
  getPublicState(){ const c = Mock.cfg(); delete c.names; c.submitted = Mock.resp().map(r => r.num); return c; },
  submitResponse(d){ const s = sanitizeSubmission(Mock.cfg(), d); s.time = nowStr(); const r = Mock.resp().filter(x => x.num !== s.num); r.push(s); r.sort((a, b) => a.num - b.num); Store.set('responses', r); return { ok: true }; },
  adminGetAll(){ return { config: Mock.cfg(), responses: Mock.resp(), result: Store.get('result') }; },
  adminSaveConfig(pin, c){ const old = Mock.cfg(); c = sanitizeConfig(c); c.open = old.open; Store.set('config', c); return Mock.adminGetAll(); },
  adminSetOpen(pin, o){ const c = Mock.cfg(); c.open = !!o; Store.set('config', c); return Mock.adminGetAll(); },
  adminClearResponses(){ Store.set('responses', []); return Mock.adminGetAll(); },
  adminSaveResult(pin, r){ Store.set('result', r); return Mock.adminGetAll(); }
};
const fmtTs = ts => { if (!ts || !ts.toDate) return ''; const d = ts.toDate(), p = n => String(n).padStart(2, '0'); return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };
const Fire = {
  async cfgRaw(){ const s = await fdb.doc('seat/config').get(); return s.exists ? s.data() : null; },
  async getPublicState(){
    const c = await Fire.cfgRaw();
    if (!c) throw new Error('선생님이 아직 좌석 설정을 저장하지 않았어요.');
    const x = sanitizeConfig(c); delete x.names; x.submitted = []; x.noStatus = true; return x;
  },
  async submitResponse(d){
    const c = await Fire.cfgRaw(); if (!c) throw new Error('선생님이 아직 좌석 설정을 저장하지 않았어요.');
    const s = sanitizeSubmission(sanitizeConfig(c), d);
    await fdb.collection('responses').doc(String(s.num)).set({ num: s.num, partner: s.partner, prefs: s.prefs, time: firebase.firestore.FieldValue.serverTimestamp() });
    return { ok: true };
  },
  async adminGetAll(){
    const [c, p, rs, res] = await Promise.all([fdb.doc('seat/config').get(), fdb.doc('seat/private').get(), fdb.collection('responses').get(), fdb.doc('seat/result').get()]);
    const raw = c.exists ? Object.assign({}, c.data()) : defaultConfig();
    raw.names = p.exists ? (p.data().names || {}) : {};
    const responses = rs.docs.map(x => { const v = x.data(); return { num: v.num, partner: v.partner == null ? null : v.partner, prefs: v.prefs || [], time: fmtTs(v.time) }; }).sort((a, b) => a.num - b.num);
    let result = null; if (res.exists) { try { result = JSON.parse(res.data().json); } catch (e) {} }
    return { config: sanitizeConfig(raw), responses, result, configSaved: c.exists };
  },
  async adminSaveConfig(pin, c){
    const old = await Fire.cfgRaw(); c = sanitizeConfig(c);
    const names = c.names; delete c.names; c.open = old ? old.open !== false : true;
    await fdb.doc('seat/config').set(c); await fdb.doc('seat/private').set({ names });
    return Fire.adminGetAll();
  },
  async adminSetOpen(pin, o){
    if (!(await Fire.cfgRaw())) throw new Error('먼저 ① 탭에서 설정을 저장해 주세요.');
    await fdb.doc('seat/config').update({ open: !!o }); return Fire.adminGetAll();
  },
  async adminClearResponses(){
    const rs = await fdb.collection('responses').get(); const b = fdb.batch(); rs.docs.forEach(d => b.delete(d.ref)); await b.commit();
    return Fire.adminGetAll();
  },
  async adminSaveResult(pin, r){ await fdb.doc('seat/result').set({ json: JSON.stringify(r) }); return Fire.adminGetAll(); }
};
function api(fn, ...args){
  if (FB) return Fire[fn](...args).catch(e => {
    if (e && e.code === 'permission-denied') throw new Error(MODE === 'admin' ? '이 구글 계정은 교사 계정으로 등록돼 있지 않아요. (보안 규칙의 이메일을 확인해 주세요)' : '지금은 제출할 수 없어요. 제출이 마감됐는지 선생님께 확인해 주세요.');
    if (e && e.code === 'unavailable') throw new Error('인터넷 연결을 확인해 주세요.');
    throw e;
  });
  return new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(Mock[fn](...args)))); } catch (e) { rej(e); } }, 120));
}

function roomHTML(layout, o){
  o = o || {};
  const desks = buildDesks(layout); const map = {}; desks.forEach(d => map[d.key] = d);
  let rows = [...Array(layout.rows).keys()], cols = [...Array(layout.pairCols).keys()];
  if (o.teacher) { rows.reverse(); cols.reverse(); }
  let h = o.teacher ? '' : '<div class="board">칠 판</div>';
  h += '<div class="room" style="grid-template-columns:repeat(' + layout.pairCols + ',minmax(0,1fr))">';
  rows.forEach(r => cols.forEach(c => {
    const d = map[r + '-' + c];
    if (!o.showAll && !d.seats.length) { h += '<div class="desk ghost"></div>'; return; }
    const extra = o.desk ? o.desk(d) : { cls: '', inner: '' };
    h += '<div class="desk ' + (extra.cls || '') + '" data-desk="' + d.key + '">';
    if (o.labels && d.label) h += '<span class="lbl">' + d.label + '번</span>';
    const idx = o.teacher ? [1, 0] : [0, 1];
    idx.forEach(s => {
      const sid = d.all[s]; const on = d.seats.indexOf(sid) >= 0;
      const sc = o.seat ? o.seat(sid, on, d) : { cls: '', html: '' };
      h += '<div class="seat ' + (on ? '' : 'off ') + (sc.cls || '') + '" data-seat="' + sid + '">' + (sc.html || '') + '</div>';
    });
    h += (extra.inner || '') + '</div>';
  }));
  h += '</div>';
  if (o.teacher) h += '<div class="board bottom">칠 판 (교사 시점)</div>';
  return h;
}
function makeQR(el, text, size){
  el.innerHTML = '';

  const img = new Image(size, size); img.alt = 'QR 코드';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(text);
  img.onerror = () => { el.innerHTML = '<div class="sub" style="width:' + size + 'px">QR을 불러오지 못했어요. 아래 주소로 QR을 만들어 주세요.</div>'; };
  el.appendChild(img);
}

app.addEventListener('click', async e => {
  if (MODE !== 'student') return;
  const t = e.target.closest('[data-num],[data-partner],[data-act],.desk.can'); if (!t) return;
  if (t.dataset.num) { S.num = +t.dataset.num; if (S.partner === S.num) S.partner = null; S.step = 2; }
  else if (t.dataset.partner) { const n = +t.dataset.partner; if (S.partner !== n) S.prefs = []; S.partner = n; S.step = 3; }
  else if (t.classList.contains('desk')) {
    const d = buildDesks(S.pub).find(x => x.key === t.dataset.desk); const i = S.prefs.indexOf(d.label);
    if (i >= 0) S.prefs.splice(i, 1); else if (S.prefs.length < 3) S.prefs.push(d.label); else toast('3순위까지만 고를 수 있어요. 먼저 하나를 취소해 주세요.');
  }
  else {
    const a = t.dataset.act;
    if (a === 'to1') S.step = 1;
    if (a === 'to2') S.step = 2;
    if (a === 'nopartner') { S.partner = null; S.prefs = []; S.step = 4; }
    if (a === 'to4') S.step = 4;
    if (a === 'back') S.step = S.partner === null ? 2 : 3;
    if (a === 'restart') return studentInit();
    if (a === 'submit') {
      S.busy = true; studentRender();
      try { await api('submitResponse', { num: S.num, partner: S.partner, prefs: S.prefs }); S.busy = false; S.step = 5; }
      catch (err) { S.busy = false; toast('제출 실패: ' + errMsg(err)); }
    }
  }
  studentRender(); window.scrollTo(0, 0);
});

    '<div class="card"><h2>학생 번호</h2><div class="grid2"><div><label class="f">번호 범위 (예: 1-35)</label><input type="text" id="fRange" value="' + esc(d.studentRange) + '"></div>' +
    '<div><label class="f">없는 번호 (쉼표로 구분)</label><input type="text" id="fEx" value="' + esc(d.studentExclude) + '"></div></div>' +
    '<p class="sub" id="stuPreview"></p>' +
    '<label class="f">이름 (선택, 교사 화면과 인쇄본에만 표시) — 한 줄에 “번호 이름”</label><textarea id="fNames" placeholder="1 김하늘&#10;2 이바다">' + esc(namesTxt) + '</textarea></div>' +
    '<div class="row"><span class="sp"></span><button class="btn" id="resetDraft">되돌리기</button><button class="btn pri" id="saveCfg">설정 저장</button></div>';

  // 행/열 삽입·삭제 시 '사용 안 함' 좌석 위치를 함께 옮김
  const shiftDisabled = (axis, at, delta) => {
    d.disabled = d.disabled.map(id => {
      const p = id.split('-').map(Number); const i = axis === 'r' ? 0 : 1;
      if (delta < 0 && p[i] === at) return null;
      if (p[i] >= at + (delta < 0 ? 1 : 0)) p[i] += delta;
      return p.join('-');
    }).filter(Boolean);
  };
  const MAXR = 10, MAXC = 8;
  const insRow = at => { if (d.rows >= MAXR) return toast('행은 최대 ' + MAXR + '개까지예요.'); shiftDisabled('r', at, 1); d.rows++; upd(); };
  const insCol = at => { if (d.pairCols >= MAXC) return toast('열은 최대 ' + MAXC + '개까지예요.'); shiftDisabled('c', at, 1); d.pairCols++; upd(); };
  const delRow = at => { if (d.rows <= 1) return toast('행은 최소 1개 있어야 해요.'); shiftDisabled('r', at, -1); d.rows--; upd(); };
  const delCol = at => { if (d.pairCols <= 1) return toast('열은 최소 1개 있어야 해요.'); shiftDisabled('c', at, -1); d.pairCols--; upd(); };
  const toggleLine = (axis, at) => {
    const ids = []; for (let r = 0; r < d.rows; r++) for (let c = 0; c < d.pairCols; c++) if ((axis === 'r' ? r : c) === at) ids.push(r + '-' + c + '-0', r + '-' + c + '-1');
    const allOff = ids.every(id => d.disabled.indexOf(id) >= 0);
    d.disabled = d.disabled.filter(id => ids.indexOf(id) < 0); if (!allOff) d.disabled = d.disabled.concat(ids); upd();
  };

  const editorHTML = () => {
    const desks = buildDesks(d); const map = {}; desks.forEach(x => map[x.key] = x);
    const cols = '34px repeat(' + d.pairCols + ',minmax(0,1fr)) 34px';
    let h = '<div class="board">칠 판</div><div class="ed" style="grid-template-columns:' + cols + '">';
    h += '<div></div>';
    for (let c = 0; c < d.pairCols; c++) h += '<div class="hd"><button class="hl" data-tcol="' + c + '" title="이 열 전체 비우기/채우기">' + (c + 1) + '열</button><button class="x" data-dcol="' + c + '" title="' + (c + 1) + '열 삭제" aria-label="' + (c + 1) + '열 삭제">×</button></div>';
    h += '<div></div>';
    for (let r = 0; r < d.rows; r++) {
      h += '<div class="hd v"><button class="hl" data-trow="' + r + '" title="이 행 전체 비우기/채우기">' + (r + 1) + '행</button><button class="x" data-drow="' + r + '" title="' + (r + 1) + '행 삭제" aria-label="' + (r + 1) + '행 삭제">×</button></div>';
      for (let c = 0; c < d.pairCols; c++) {
        const k = map[r + '-' + c];
        h += '<div class="desk" data-desk="' + k.key + '">' + (k.label ? '<span class="lbl">' + k.label + '번</span>' : '') +
          k.all.map(sid => '<div class="seat' + (k.seats.indexOf(sid) >= 0 ? '' : ' off') + '" data-seat="' + sid + '"></div>').join('') + '</div>';
      }
      h += '<div></div>';
      if (r < d.rows - 1) h += '<div class="ins"><button class="plus sm" data-irow="' + (r + 1) + '" title="' + (r + 1) + '행 뒤에 행 끼워 넣기">+</button></div>' + '<div class="gapline" style="grid-column:span ' + (d.pairCols + 1) + '"></div>';
    }
    h += '<div></div><div class="addrow" style="grid-column:span ' + d.pairCols + '"><button class="btn" data-irow="' + d.rows + '">+ 맨 뒤에 행 추가</button>';
    if (d.pairCols > 1) h += '<span class="sub">열 끼워 넣기:</span>' + [...Array(d.pairCols - 1).keys()].map(c => '<button class="btn chip" data-icol="' + (c + 1) + '">+ ' + (c + 1) + '·' + (c + 2) + '열 사이</button>').join('');
    h += '<button class="btn" data-icol="' + d.pairCols + '">+ 맨 오른쪽에 열 추가</button></div>';
    return h + '</div>';
  };

  const upd = () => {
    $('#editMap').innerHTML = editorHTML();
    $('#vRows').textContent = d.rows; $('#vCols').textContent = d.pairCols;
    const desks = buildDesks(d); const seats = desks.reduce((a, x) => a + x.seats.length, 0); const two = desks.filter(x => x.seats.length === 2).length;
    d.students = parseNums(d.studentRange, d.studentExclude);
    const n = d.students.length;
    $('#seatCount').innerHTML = '좌석 <b>' + seats + '</b>석 (2인 책상 ' + two + '개) · 학생 <b>' + n + '</b>명' + (seats < n ? ' <span style="color:#c0392b">· 좌석 ' + (n - seats) + '석 부족</span>' : '');
    $('#stuPreview').textContent = '총 ' + n + '명: ' + (d.students.join(', ') || '없음');
  };
  upd();
  $('#fTitle').oninput = e => d.title = e.target.value;
  $('#pane').querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const v = +b.dataset.v;
    if (b.dataset.step === 'rows') v > 0 ? insRow(d.rows) : delRow(d.rows - 1);
    else v > 0 ? insCol(d.pairCols) : delCol(d.pairCols - 1);
  });
  $('#fRange').oninput = e => { d.studentRange = e.target.value; upd(); };
  $('#fEx').oninput = e => { d.studentExclude = e.target.value; upd(); };
  $('#fNames').oninput = e => { const m = {}; e.target.value.split('\n').forEach(l => { const x = l.trim().match(/^(\d+)[\s,.:\t]+(.+)$/); if (x) m[x[1]] = x[2].trim(); }); d.names = m; };
  $('#editMap').onclick = e => {
    const b = e.target.closest('button,[data-seat]'); if (!b) return; const ds = b.dataset;
    if (ds.seat) { const i = d.disabled.indexOf(ds.seat); if (i >= 0) d.disabled.splice(i, 1); else d.disabled.push(ds.seat); upd(); }
    else if (ds.trow != null) toggleLine('r', +ds.trow);
    else if (ds.tcol != null) toggleLine('c', +ds.tcol);
    else if (ds.drow != null) delRow(+ds.drow);
    else if (ds.dcol != null) delCol(+ds.dcol);
    else if (ds.irow != null) insRow(+ds.irow);
    else if (ds.icol != null) insCol(+ds.icol);
  };
  $('#resetDraft').onclick = () => { A.draft = JSON.parse(JSON.stringify(A.cfg)); paneSetup(); };
  $('#saveCfg').onclick = async () => {
    const layoutChanged = A.cfg.rows !== d.rows || A.cfg.pairCols !== d.pairCols || A.cfg.disabled.slice().sort().join() !== d.disabled.slice().sort().join();
    if (layoutChanged && A.responses.length && !(await confirmBox('이미 ' + A.responses.length + '명이 제출했어요.\n좌석배치도를 바꾸면 책상 번호가 달라져 학생들이 고른 자리 희망이 엉뚱한 자리로 바뀔 수 있어요.\n저장할까요?', '저장'))) return;
    try { adminLoad(await api('adminSaveConfig', A.pin, d)); toast('설정을 저장했어요.'); } catch (err) { toast('저장 실패: ' + errMsg(err)); }
  };
}

    '<div id="printArea"><div class="printonly"><h1>' + esc(c.title) + '</h1><p class="sub">' + esc(R.createdAt || '') + '</p></div>' +

      teacher: A.teacher, labels: false,

        return { inner: ok && g != null ? '<span class="tag' + (g ? ' k' + g : '') + '">' + (g ? g + '순위' : '랜덤') + '</span>' : '' }; },
      seat: (sid, on) => { if (!on) return { html: '' }; const n = R.seatOf[sid]; const d = deskOfSeat(sid); const other = R.seatOf[d + '-' + (sid.endsWith('-0') ? 1 : 0)];
        return { cls: (n && mateOf[n] === other ? 'mate ' : '') + (A.sw === sid ? 'sw ' : '') + (n ? '' : 'empty'), html: n ? n + (c.names && c.names[n] ? '<span class="nm">' + esc(c.names[n]) + '</span>' : '') : '빈자리' }; }

  if (R.unsubmitted.length) h += '<p class="sub">미제출로 랜덤 배치: ' + R.unsubmitted.join(', ') + '</p>';
  h += '<div class="legend"><span><i style="background:#e6efff"></i>서로 지목한 짝</span><span><i style="background:#f1f4f8"></i>랜덤 배치</span><span>책상 아래 표시: 짝이 받은 희망 순위</span></div></div>';
  $('#pane').innerHTML = h; bindResult();
}

    if (A.sw !== sid) { const so = A.result.seatOf; const a = so[A.sw], b = so[sid]; if (b == null) delete so[A.sw]; else so[A.sw] = b; if (a == null) delete so[sid]; else so[sid] = a; A.saved = false; }
    A.sw = null; paneResult();
  };
}

/* ---------- 체험 모드 막대 ---------- */
function demoFill(){
  const c = Mock.cfg(); const st = shuffle(c.students); const labels = buildDesks(c).filter(d => d.seats.length === 2).map(d => d.label);
  const out = []; let i = 0; const pick = () => shuffle(labels).slice(0, 1 + Math.floor(Math.random() * 3));
  const t = nowStr();
  while (i < st.length) {
    const r = Math.random();
    if (r < 0.62 && i + 1 < st.length) { const a = st[i], b = st[i + 1]; const pr = pick(); out.push({ num: a, partner: b, prefs: pr, time: t }, { num: b, partner: a, prefs: Math.random() < .6 ? pr : pick(), time: t }); i += 2; }
    else if (r < 0.75) { out.push({ num: st[i], partner: st[(i + 3) % st.length], prefs: pick(), time: t }); i++; }
    else if (r < 0.9) { out.push({ num: st[i], partner: null, prefs: [], time: t }); i++; }
    else i++;
  }
  out.sort((a, b) => a.num - b.num); Store.set('responses', out);
}
function demoBar(){
  const b = $('#demo'); b.hidden = false;
  b.innerHTML = '<b>체험판</b><span style="opacity:.75">파이어베이스 설정 전이라 이 브라우저에만 저장돼요</span><span class="sp"></span>' +
    '<button class="btn' + (MODE === 'student' ? ' on' : '') + '" data-m="student">학생 화면</button><button class="btn' + (MODE === 'admin' ? ' on' : '') + '" data-m="admin">교사 화면</button>' +
    '<button class="btn" data-m="fill">가상 응답 채우기</button><button class="btn" data-m="reset">초기화</button>';
  b.onclick = async e => {
    const m = e.target.dataset.m; if (!m) return;
    if (m === 'fill') { demoFill(); toast('가상 응답을 만들었어요.'); A.result = null; A.saved = true; }
    else if (m === 'reset') { Store.set('responses', []); Store.set('result', null); Store.set('config', defaultConfig()); A.result = null; A.saved = true; toast('초기화했어요.'); }
    else MODE = m;
    demoBar(); MODE === 'admin' ? adminInit() : studentInit();
  };
}

if (!REAL) demoBar();
MODE === 'admin' ? adminInit() : studentInit();
